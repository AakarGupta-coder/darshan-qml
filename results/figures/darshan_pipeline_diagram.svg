<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>

  <!-- ==================== HEADER / START ==================== -->
  <!-- Start Pill -->
  <rect x="480" y="20" width="140" height="36" rx="18" fill="#2E7D32" filter="url(#shadow)"/>
  <text x="550" y="43" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Start</text>

  <!-- Flow Line Start -> Input -->
  <line x1="550" y1="56" x2="550" y2="72" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Input Oval Node -->
  <rect x="400" y="74" width="300" height="42" rx="21" fill="#F7F3EB" stroke="#7A6855" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="99" fill="#333333" font-size="14" font-weight="600" text-anchor="middle">Dataset Vector Arrives at Darshan Engine</text>

  <!-- Flow Line Input -> Perception & Pre-Processing -->
  <line x1="550" y1="116" x2="550" y2="134" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== CARD 1: INGESTION & PRE-PROCESSING (BLUE) ==================== -->
  <g id="card-ingestion">
    <!-- Main Outer Container -->
    <rect x="90" y="138" width="530" height="155" rx="12" fill="#E6F0F5" stroke="#7AACC7" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Card Header -->
    <path d="M 90 150 A 12 12 0 0 1 102 138 L 608 138 A 12 12 0 0 1 620 150 L 620 172 L 90 172 Z" fill="#3B7A9E"/>
    <!-- Header Icon -->
    <g transform="translate(105, 147)" fill="#FFFFFF">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" scale="0.7"/>
    </g>
    <text x="112" y="161" fill="#FFFFFF" font-size="14" font-weight="700">Data Ingestion &amp; Pre-Processing</text>

    <!-- Sub-Nodes inside Blue Container -->
    <!-- Node 1: Stratified Train/Test Split -->
    <rect x="112" y="190" width="135" height="52" rx="8" fill="#2B6888" filter="url(#shadow)"/>
    <text x="179" y="212" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Stratified 80/20</text>
    <text x="179" y="228" fill="#D2E6F0" font-size="11" text-anchor="middle">Train/Test Split</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="247" y1="216" x2="263" y2="216" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 2: StandardScaler Normalization -->
    <rect x="265" y="190" width="145" height="52" rx="8" fill="#2B6888" filter="url(#shadow)"/>
    <text x="337" y="212" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">StandardScaler</text>
    <text x="337" y="228" fill="#D2E6F0" font-size="11" text-anchor="middle">Z-Score Normalization</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="410" y1="216" x2="426" y2="216" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 3: Feature Tensor Pre-Processing -->
    <rect x="428" y="190" width="170" height="52" rx="8" fill="#2B6888" filter="url(#shadow)"/>
    <!-- Icon overlay -->
    <circle cx="445" cy="204" r="2" fill="#64B5F6"/>
    <circle cx="452" cy="214" r="2" fill="#64B5F6"/>
    <circle cx="442" cy="222" r="2" fill="#64B5F6"/>
    <text x="518" y="212" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Feature Tensor</text>
    <text x="518" y="228" fill="#D2E6F0" font-size="11" text-anchor="middle">Encoding &amp; Scaling</text>

    <!-- Bottom Pill Badge -->
    <rect x="250" y="267" width="200" height="22" rx="11" fill="#2B6888"/>
    <text x="350" y="282" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">loader.py Pipeline</text>
  </g>

  <!-- Flow Line Card 1 -> Card 2 -->
  <line x1="598" y1="216" x2="648" y2="216" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>


  <!-- ==================== CARD 2: DIMENSIONAL PARITY ENGINE (TAN/BROWN) ==================== -->
  <g id="card-parity">
    <!-- Outer Container -->
    <rect x="650" y="138" width="370" height="155" rx="12" fill="#F9F3EA" stroke="#D9C4B1" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Card Header -->
    <path d="M 650 150 A 12 12 0 0 1 662 138 L 1008 138 A 12 12 0 0 1 1020 150 L 1020 172 L 650 172 Z" fill="#B38867"/>
    <text x="670" y="161" fill="#FFFFFF" font-size="14" font-weight="700">Fair-Track Parity Engine</text>

    <!-- Inner Node 1: Track Selection -->
    <rect x="670" y="190" width="115" height="52" rx="8" fill="#FFFFFF" stroke="#8C6D53" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="727" y="212" fill="#333333" font-size="12" font-weight="600" text-anchor="middle">Evaluate</text>
    <text x="727" y="228" fill="#555555" font-size="11" text-anchor="middle">Track Selection</text>

    <!-- Arrow 1 -> Decision Diamond -->
    <line x1="785" y1="216" x2="805" y2="216" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Decision Diamond: Parity Constraint? -->
    <g transform="translate(807, 185)">
      <polygon points="55,0 110,31 55,62 0,31" fill="#FFFFFF" stroke="#8C6D53" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="55" y="28" fill="#333333" font-size="11" font-weight="700" text-anchor="middle">Dimensional</text>
      <text x="55" y="42" fill="#333333" font-size="11" font-weight="700" text-anchor="middle">Parity?</text>
    </g>

    <!-- Subtext note under diamond -->
    <text x="917" y="265" fill="#6E4D32" font-size="10" font-weight="600" text-anchor="middle">Fair Track: PCA to N-Qubits</text>
    <text x="917" y="278" fill="#7A6855" font-size="9.5" text-anchor="middle">Full Track: Full D-Dimensional Space</text>
  </g>


  <!-- ==================== FLOW LINES FROM TOP CARDS TO BOTTOM CARDS ==================== -->
  <!-- Line from Card 1 (Ingestion) down to Model Taxonomy (Purple) -->
  <path d="M 179 242 L 179 315 L 210 315" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Line from Card 2 (Parity Engine Diamond) down to Model Taxonomy & Execution -->
  <path d="M 862 247 L 862 315 L 830 315" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>


  <!-- ==================== CARD 3: MODEL TAXONOMY (PURPLE) ==================== -->
  <g id="card-models">
    <!-- Outer Container -->
    <rect x="90" y="325" width="310" height="235" rx="12" fill="#F4ECF4" stroke="#C6A4C6" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Card Header -->
    <path d="M 90 337 A 12 12 0 0 1 102 325 L 388 325 A 12 12 0 0 1 400 325 L 400 359 L 90 359 Z" fill="#7B4B7B"/>
    <text x="110" y="348" fill="#FFFFFF" font-size="14" font-weight="700">Model Taxonomy (models/)</text>

    <!-- Model Family 1: Parampara Baselines -->
    <rect x="110" y="372" width="270" height="42" rx="6" fill="#7B4B7B" filter="url(#shadow)"/>
    <text x="122" y="390" fill="#FFFFFF" font-size="12" font-weight="700">Parampara Family</text>
    <text x="122" y="405" fill="#E8D5E8" font-size="10.5">Classical Dual QP SVM &amp; GridSearchCV</text>

    <!-- Model Family 2: Ananta VQC -->
    <rect x="110" y="424" width="270" height="42" rx="6" fill="#7B4B7B" filter="url(#shadow)"/>
    <text x="122" y="442" fill="#FFFFFF" font-size="12" font-weight="700">Ananta Family</text>
    <text x="122" y="457" fill="#E8D5E8" font-size="10.5">Pure VQC &amp; Data Re-Uploading Circuit</text>

    <!-- Model Family 3: Samyoga Hybrid -->
    <rect x="110" y="476" width="270" height="42" rx="6" fill="#7B4B7B" filter="url(#shadow)"/>
    <text x="122" y="494" fill="#FFFFFF" font-size="12" font-weight="700">Samyoga Vanguard Hybrid</text>
    <text x="122" y="509" fill="#E8D5E8" font-size="10.5">Quantum Frontend + SSM / MoE / PyTorch</text>

    <!-- Bottom Pill Badge -->
    <rect x="175" y="527" width="140" height="22" rx="11" fill="#7B4B7B"/>
    <text x="245" y="542" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Darshan Model Zoo</text>
  </g>

  <!-- Flow Line Card 3 (Models) -> Card 4 (Execution Lab) -->
  <line x1="400" y1="442" x2="438" y2="442" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>


  <!-- ==================== CARD 4: EXPERIMENTAL LABORATORY (GREEN) ==================== -->
  <g id="card-execution">
    <!-- Outer Container -->
    <rect x="440" y="325" width="270" height="235" rx="12" fill="#EBF3EC" stroke="#98C19C" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Card Header -->
    <path d="M 440 337 A 12 12 0 0 1 452 325 L 698 325 A 12 12 0 0 1 710 325 L 710 359 L 440 359 Z" fill="#4E8452"/>
    <text x="460" y="348" fill="#FFFFFF" font-size="14" font-weight="700">Experimental Laboratory</text>

    <!-- Inner Node 1: Multi-Seed Suites -->
    <rect x="460" y="372" width="105" height="48" rx="6" fill="#3E6F42" filter="url(#shadow)"/>
    <text x="512" y="392" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Multi-Seed</text>
    <text x="512" y="408" fill="#C8E6C9" font-size="10.5" text-anchor="middle">Test Suites</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="565" y1="396" x2="578" y2="396" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Inner Node 2: NISQ & Noise Engine -->
    <rect x="580" y="372" width="110" height="48" rx="6" fill="#3E6F42" filter="url(#shadow)"/>
    <text x="635" y="392" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">NISQ Decoherence</text>
    <text x="635" y="408" fill="#C8E6C9" font-size="10.5" text-anchor="middle">&amp; Noise Model</text>

    <!-- Central Route Pill: Statistical Evaluation -->
    <rect x="490" y="432" width="170" height="26" rx="13" fill="#3E6F42" filter="url(#shadow)"/>
    <text x="575" y="449" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Evaluate Model Metrics</text>

    <!-- Connectors down to Branch Destinations -->
    <path d="M 575 458 L 575 470 L 515 470 L 515 480" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 575 458 L 575 470 L 635 470 L 635 480" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Destination 1: Welch's t-test & Cohen's d -->
    <rect x="460" y="482" width="110" height="42" rx="6" fill="#F7F3EB" stroke="#7A6855" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="515" y="500" fill="#333333" font-size="11" font-weight="700" text-anchor="middle">Welch's t-test</text>
    <text x="515" y="514" fill="#555555" font-size="10" text-anchor="middle">&amp; Cohen's d</text>

    <!-- Destination 2: Wilcoxon & Convergence -->
    <rect x="580" y="482" width="110" height="42" rx="6" fill="#F7F3EB" stroke="#7A6855" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="635" y="500" fill="#333333" font-size="11" font-weight="700" text-anchor="middle">Wilcoxon Ranks</text>
    <text x="635" y="514" fill="#555555" font-size="10" text-anchor="middle">&amp; Win Rates</text>
  </g>

  <!-- Flow Line Card 4 (Execution) -> Card 5 (Monitoring & Analytics) -->
  <line x1="710" y1="442" x2="728" y2="442" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>


  <!-- ==================== CARD 5: MONITORING & ANALYTICS (DARK RED) ==================== -->
  <g id="card-monitoring">
    <!-- Outer Container -->
    <rect x="730" y="325" width="290" height="235" rx="12" fill="#8C2D38" filter="url(#card-shadow)"/>
    
    <!-- Card Header -->
    <g transform="translate(745, 337)" fill="#FFFFFF">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
    </g>
    <text x="772" y="352" fill="#FFFFFF" font-size="14" font-weight="700">Output &amp; Visual Synthesis</text>
    <line x1="745" y1="365" x2="1005" y2="365" stroke="#B55B66" stroke-width="1"/>

    <!-- Bullet Item 1 -->
    <circle cx="755" cy="388" r="4" fill="#FFFFFF"/>
    <text x="770" y="392" fill="#FFFFFF" font-size="12" font-weight="600">Rich Console UI Dashboard</text>

    <!-- Bullet Item 2 -->
    <circle cx="755" cy="423" r="4" fill="#FFFFFF"/>
    <text x="770" y="427" fill="#FFFFFF" font-size="12" font-weight="600">Persistent CSV &amp; Audit Logs</text>

    <!-- Bullet Item 3 -->
    <circle cx="755" cy="458" r="4" fill="#FFFFFF"/>
    <text x="770" y="462" fill="#FFFFFF" font-size="12" font-weight="600">300 DPI Publication Charts</text>

    <!-- Bullet Item 4 -->
    <circle cx="755" cy="493" r="4" fill="#FFFFFF"/>
    <text x="770" y="497" fill="#FFFFFF" font-size="12" font-weight="600">Automated AI Interpretation</text>

    <!-- Bullet Item 5 -->
    <circle cx="755" cy="528" r="4" fill="#FFFFFF"/>
    <text x="770" y="532" fill="#FFFFFF" font-size="12" font-weight="600">Quantum Advantage Verdict</text>
  </g>


  <!-- ==================== CONNECTIONS TO END NODE ==================== -->
  <!-- Line from Card 3 (Models) to End -->
  <path d="M 245 560 L 245 610 L 470 610" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Line from Card 4 (Execution Lab - Welch) to End -->
  <path d="M 515 524 L 515 620 L 525 620" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Line from Card 5 (Monitoring) down to End -->
  <path d="M 875 560 L 875 620 L 630 620" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== HEADER / END NODE ==================== -->
  <g transform="translate(480, 602)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#2E7D32" filter="url(#shadow)"/>
    <text x="70" y="23" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">End</text>
  </g>


  <!-- ==================== LEGEND AT THE BOTTOM ==================== -->
  <g id="legend" transform="translate(230, 680)">
    <!-- Legend Pill 1: Ingestion & Pre-Processing (Blue) -->
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#2B6888" filter="url(#shadow)"/>
    <text x="95" y="21" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Ingestion &amp; Parity Engine</text>

    <!-- Flow Arrow Legend 1 -> 2 -->
    <line x1="198" y1="17" x2="222" y2="17" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Legend Pill 2: Model Taxonomy (Brown/Tan) -->
    <rect x="230" y="0" width="180" height="34" rx="17" fill="#6E4D32" filter="url(#shadow)"/>
    <text x="320" y="21" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Model Taxonomy</text>

    <!-- Flow Arrow Legend 2 -> 3 -->
    <line x1="418" y1="17" x2="442" y2="17" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Legend Pill 3: Output & Analytics (Dark Red) -->
    <rect x="450" y="0" width="190" height="34" rx="17" fill="#8C2D38" filter="url(#shadow)"/>
    <text x="545" y="21" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">Synthesis &amp; Analytics</text>
  </g>
</svg>
